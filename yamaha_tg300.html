function toSampleAddresses(bytes, index) {
	const startAddr = ((bytes[index] << 8) | bytes[index + 1]) * 128;
	return [
		startAddr,
		startAddr + ((bytes[index + 2] << 8) | bytes[index + 3]),
		startAddr + ((bytes[index + 4] << 8) | bytes[index + 5]),
	];
}

	<div class="d-flex flex-row gap-3 px-3">
		<table class="table table-sm table-hover w-auto mb-0">
			<thead>
				<tr>
					<th class="text-end">Note</th>
					<th class="text-end">No.</th>
					<th>Name</th>
					<th class="text-end">Pitch<br>Coarse</th>
					<th class="text-end">Pitch<br>Fine</th>
					<th class="text-end"><abbr title="Level">Lev.</abbr></th>
					<th class="text-end">Pan</th>
					<th class="text-end"><abbr title="Reverb">Rev</abbr></th>
					<th class="text-end"><abbr title="Chorus">Cho</abbr></th>
					<th class="text-end"><abbr title="Variation">Var</abbr></th>
					<th class="text-end"><abbr title="Group">Grp.</abbr></th>
					<th class="text-end">Key<br><abbr title="Assign">Asgn.</abbr></th>
					<th class="text-end"><abbr title="Receive">Rcv</abbr><br>Note<br>Off</th>
					<th class="text-end"><abbr title="Receive">Rcv</abbr><br>Note<br>On</th>
					<th class="text-end">Cutoff<br><abbr title="Frequency">Freq</abbr></th>
					<th class="text-end"><abbr title="Resonance">Reso</abbr></th>
					<th class="text-end"><abbr title="Attack Rate">AR</abbr></th>
					<th class="text-end"><abbr title="Decay1 Rate">D1R</abbr></th>
					<th class="text-end"><abbr title="Decay2 Rate">D2R</abbr></th>
					<th class="text-end">Key</th>
					<th class="text-end">No.</th>
					<th class="text-end">Note<br>Shift</th>
					<th class="text-end">Start <abbr title="Address">Addr.</abbr></th>
					<th class="text-end">Loop <abbr title="Address">Addr.</abbr></th>
					<th class="text-end">End <abbr title="Address">Addr.</abbr></th>
					<th class="text-end">Reverse</th>
				</tr>
			</thead>
			<tbody>
			${(Object.entries(drumSet.notes).map((e) => [Number(e[0]), e[1]]).sort((a, b) => a[0] - b[0])).map(([noteNo, note]) => html`
				<tr>
					<td class="text-end">${fmt.noteNameY(noteNo)}</td>
					<td class="text-end text-muted">${noteNo}</td>
					<td class="font-monospace">${note.name}</td>
					<td class="text-end">${note.bytes[0]}</td>
					<td class="text-end">${fmt.sint7offset6(note.bytes[1])}</td>
					<td class="text-end">${note.bytes[2]}</td>
					<td class="text-end">${fmt.panpotR(note.bytes[4])}</td>
					<td class="text-end">${note.bytes[5]}</td>
					<td class="text-end">${note.bytes[6]}</td>
					<td class="text-end">${note.bytes[15]}</td>
					<td class="text-end">${note.bytes[3]}</td>
					<td class="text-end">${note.bytes[7]}</td>
					<td class="text-end">${fmt.onOff(note.bytes[8])}</td>
					<td class="text-end">${fmt.onOff(note.bytes[9])}</td>
					<td class="text-end">${note.bytes[10]}</td>
					<td class="text-end">${note.bytes[11]}</td>
					<td class="text-end">${note.bytes[12]}</td>
					<td class="text-end">${note.bytes[14]}</td>
					<td class="text-end">${note.bytes[13]}</td>
				${(note.toneRef) ? html`
					<td colspan="7">Voice No.${note.toneNo}: <a class="font-monospace" href="${note.toneRef.$ref}">${note.toneRef.name}</a></td>
				` : html`
					<td class="text-end">${fmt.noteNameY(note.bytes[19])}</td>
					<td class="text-end text-muted">${note.bytes[19]}</td>
					<td class="text-end">${fmt.sint8(note.bytes[27])}</td>
					<td class="text-end font-monospace">${toSampleAddresses(note.bytes, 20)[0].toString(16).padStart(6, '0')}</td>
					<td class="text-end font-monospace">${toSampleAddresses(note.bytes, 20)[1].toString(16).padStart(6, '0')}</td>
					<td class="text-end font-monospace">${toSampleAddresses(note.bytes, 20)[2].toString(16).padStart(6, '0')}</td>
					<td class="text-end">${fmt.onOff((note.bytes[18] & 0x02) !== 0)}</td>
				`}
				</tr>
			`)}
			</tbody>
		</table>
	</div>
`;

window.addEventListener('DOMContentLoaded', makeDomLoadedHandler({
	lists: [
		{id: 'toneMaps', label: 'Tone Map',  renderer: templateToneMapList},
		{id: 'drumMaps', label: 'Drum Map',  renderer: templateDrumMapList},
		{id: 'tones',    label: 'Voices',    renderer: templateToneList},
		{id: 'waves',    label: 'Waves',     renderer: templateWaveList},
		{id: 'drumSets', label: 'Drum Kits', renderer: templateDrumSetList},
	],
	details: {
		tones:    templateTone,
		drumSets: templateDrumSet,
	},
}, bootstrap.Modal.getOrCreateInstance.bind(bootstrap.Modal)));
</script>
</head>

</body>
</html>
