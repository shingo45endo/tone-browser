<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tone-browser</title>
<link href="./common.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script type="module">
/* global bootstrap */
import {html} from 'https://unpkg.com/lit-html@2.8.0?module';
import {makeDomLoadedHandler} from './common.js';
import {formatters as fmt} from './formatters.js';

function getFilterTypeName(value) {
	return ['LPF', 'HPF'][value] ?? 'Off';
}

function fromSignMagnitude(value) {
	return ((value & 0x80) === 0) ? value : -(value & 0x7f);
}

function getDelayTimeText(value) {
	return ((value & 0x80) !== 0) ? 'Note Off' : value;
}

const templateToneMapList = (json) => html`
	<table class="table table-sm table-hover w-auto">
		<thead>
			<tr>
				<th class="text-end my-number">Prog#</th>
				<th class="text-end my-number">BankM</th>
				<th class="text-end my-number">No.</th>
				<th>Instrument</th>
			</tr>
		</thead>
		<tbody>
		${json.toneMaps.map((toneMap) => html`
			<tr>
				<td class="text-end">${toneMap.prog}</td>
				<td class="text-end">${toneMap.bankM}</td>
				<td class="text-end">${toneMap.toneNo}</td>
				<td class="font-monospace"><a href="${toneMap.toneRef.$ref}">${toneMap.toneRef.name}</a></td>
			</tr>
		`)}
		</tbody>
	</table>
`;

const templateWaveList = (json) => html`

				<td>
					<table class="table table-sm table-borderless mb-0">

							<tr>
								<th class="text-end">Low</th>
								<th class="text-end">No.</th>
								<th class="text-end">High</th>

								<th class="text-end">Sample No.</th>
								<th class="text-end"><abbr title="Original">Orig.</abbr> Key</th>
								<th class="text-end">No.</th>
							</tr>
						</thead>
						<tbody>
						${wave.sampleSlots.map((sampleSlot) => html`

								<td class="text-end">${fmt.noteNameR(sampleSlot.low)}</td>
								<td class="text-end text-muted">${sampleSlot.low}</td>
								<td class="text-end">${fmt.noteNameR(sampleSlot.high)}</td>
								<td class="text-end text-muted">${sampleSlot.high}</td>
								<td class="text-end">${(sampleSlot.sampleNo >= 0) ? sampleSlot.sampleNo : ''}</td>
							${((sample) => html`
								<td class="text-end">${(sample) ? fmt.noteNameR(sample.key) : '--'}</td>
								<td class="text-end text-muted">${sample?.key ?? '--'}</td>
							`)(json.samples[sampleSlot.sampleNo])}
							</tr>
						`)}
						</tbody>
					</table>
				</td>
			</tr>

	</table>
`;

const templateSampleList = (json) => html`
	<table class="table table-sm table-hover w-auto">
		<thead>
			<tr>
				<th class="text-end my-number">#</th>
				<th class="text-end"><abbr title="Original">Orig.</abbr> Key</th>
				<th class="text-end">No.</th>
				<th class="text-end">Start <abbr title="Address">Addr.</abbr></th>
				<th class="text-end">Loop <abbr title="Address">Addr.</abbr></th>
				<th class="text-end">End <abbr title="Address">Addr.</abbr></th>
				<th class="text-end"><abbr title="Start to End">S-E</abbr> <abbr title="Length">Len.</abbr></th>
				<th class="text-end"><abbr title="Start to Loop">S-L</abbr> <abbr title="Length">Len.</abbr></th>
				<th class="text-end"><abbr title="Loop to End">L-E</abbr> <abbr title="Length">Len.</abbr></th>
				<th class="text-end">Loop Mode</th>
				<th class="text-end">Fine Tune</th>
				<th class="text-end">Loop Tune</th>
				<th class="text-end">Level</th>
			</tr>
		</thead>
		<tbody>
		${json.samples.map((sample) => html`
			<tr>
				<th class="text-end">${sample.sampleNo}</th>
				<td class="text-end">${fmt.noteNameR(sample.key)}</td>
				<td class="text-end text-muted">${sample.key}</td>
				<td class="text-end font-monospace">${sample.addrBegin.toString(16).padStart(6, '0')}</td>
				<td class="text-end font-monospace">${(sample.addrBegin + (sample.sampleLen - sample.loopLen)).toString(16).padStart(6, '0')}</td>
				<td class="text-end font-monospace">${(sample.addrBegin + sample.sampleLen).toString(16).padStart(6, '0')}</td>
				<td class="text-end">${sample.sampleLen}</td>
				<td class="text-end">${sample.sampleLen - sample.loopLen}</td>
				<td class="text-end">${sample.loopLen}</td>
				<td class="text-end">${sample.loopMode}</td>
				<td class="text-end">${sample.pitch}</td>
				<td class="text-end">${((sample.bytes[14] << 8) | sample.bytes[15]) - 1024}</td>
				<td class="text-end">${sample.bytes[0]}</td>
			</tr>
		`)}
		</tbody>
	</table>
`;

// Keys 125-127 can each play another tone. A negative tone number means no tone.
const templateTone = (tone, json) => html`
	<div class="card mb-3">
		<div class="card-header">
			<h2 class="h6 mb-0">Instrument No.${tone.toneNo}: <span class="font-monospace h4">${tone.name}</span></h2>
		</div>
		<div class="card-body d-flex flex-row gap-3 pb-0">
			<div>
				<div class="h6" aria-hidden="true">&nbsp;</div>
				<table class="table table-sm">
					<tbody>
						<tr>
							<th>Instrument Level</th>
							<td class="text-end">${tone.commonBytes[12]}</td>
						</tr>
						<tr>
							<th>Pitch Curve</th>
							<td class="text-end">${tone.commonBytes[19]}</td>
						</tr>
						<tr>
							<th>Pan Key Follow Switch</th>
							<td class="text-end">${fmt.onOff((tone.commonBytes[31] & 0x03) !== 0)}</td>
						</tr>
						<tr>
							<th>Voice Steal Mode</th>
							<td class="text-end">${tone.commonBytes[13] & 0x01}</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div>
				<h3 class="h6">LFO1</h3>
				<table class="table table-sm">
					<tbody>
						<tr>
							<th>Waveform</th>
							<td class="text-end">${tone.commonBytes[14]}</td>
						</tr>
						<tr>
							<th>Rate</th>
							<td class="text-end">${tone.commonBytes[15]}</td>
						</tr>
						<tr>
							<th>Delay</th>
							<td class="text-end">${tone.commonBytes[16]}</td>
						</tr>
						<tr>
							<th>Fade</th>
							<td class="text-end">${tone.commonBytes[17]}</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div>
				<h3 class="h6">Special Keys</h3>
				<table class="table table-sm">
					<thead>
						<tr>
							<th class="text-end">Note</th>
							<th class="text-end">No.</th>
							<th class="text-end my-number">No.</th>
							<th>Instrument</th>
							<th class="text-end">Key</th>
							<th class="text-end">No.</th>
						</tr>
					</thead>
					<tbody>
					${[0, 1, 2].map((index) => ((toneNo) => html`
						<tr>
							<td class="text-end">${fmt.noteNameR(125 + index)}</td>
							<td class="text-end text-muted">${125 + index}</td>
							${((toneNo & 0x8000) !== 0) ? html`<td class="text-end">-</td><td></td><td></td><td></td>` : html`
								<td class="text-end">${toneNo}</td>
								<td class="font-monospace"><a href="#/tones/${toneNo}">${json.tones[toneNo].name}</a></td>
								<td class="text-end">${fmt.noteNameR(tone.commonBytes[26 + index])}</td>
								<td class="text-end text-muted">${tone.commonBytes[26 + index]}</td>
							`}
						</tr>
					`)((tone.commonBytes[20 + index * 2] << 8) | tone.commonBytes[21 + index * 2]))}
					</tbody>
				</table>
			</div>
		</div>
	</div>
	${tone.voices.map((voice) => templateVoice(voice, json))}
`;

const templateDrumSet = (drumSet, _) => html`
	<div class="card mb-3">
		<div class="card-header">
			<h2 class="h6 mb-0">Drum Set No.${drumSet.drumSetNo}: <span class="font-monospace h4">${drumSet.name}</span></h2>
		</div>
		<div class="card-body d-flex flex-row gap-3 py-0">
		</div>
	</div>
	<div class="d-flex flex-row gap-3 px-3">
		<table class="table table-sm table-hover w-auto mb-0">
			<thead>
				<tr>
					<th class="text-end">Note</th>
					<th class="text-end">No.</th>
					<th class="text-end my-number">No.</th>
					<th>Instrument</th>
					<th class="text-end">Pitch Coarse</th>
					<th class="text-end"><abbr title="Instrument">Inst</abbr> Level</th>
					<th class="text-end"><abbr title="Instrument">Inst</abbr> Pan</th>
					<th class="text-end">Reverb Send</th>
					<th class="text-end">Chorus Send</th>
					<th class="text-end">Assign Group</th>
					<th class="text-end"><abbr title="Receive">Rx</abbr> Note Off</th>
					<th class="text-end"><abbr title="Receive">Rx</abbr> Note On</th>
				</tr>
			</thead>
			<tbody>
			${(Object.entries(drumSet.notes).map((e) => [Number(e[0]), e[1]]).sort((a, b) => a[0] - b[0])).map(([noteNo, note]) => html`
				<tr>
					<td class="text-end">${fmt.noteNameR(noteNo)}</td>
					<td class="text-end text-muted">${noteNo}</td>
					<td class="text-end">${note.toneNo}</td>
					<td class="font-monospace"><a href="${note.toneRef.$ref}">${note.toneRef.name}</a></td>
					<td class="text-end">${note.pitch}</td>
					<td class="text-end">${note.level}</td>
					<td class="text-end">${fmt.panpotR(note.panpot)}</td>
					<td class="text-end">${note.reverb}</td>
					<td class="text-end">${note.chorus}</td>
					<td class="text-end">${note.group}</td>
					<td class="text-end">${fmt.onOff(note.isRxNoteOff)}</td>
					<td class="text-end">${fmt.onOff(note.isRxNoteOn)}</td>
				</tr>
			`)}
			</tbody>
		</table>
	</div>
`;

window.addEventListener('DOMContentLoaded', makeDomLoadedHandler({
	lists: [
		{id: 'toneMaps', label: 'Tone Map',    renderer: templateToneMapList},
		{id: 'drumMaps', label: 'Drum Map',    renderer: templateDrumMapList},
		{id: 'tones',    label: 'Instruments', renderer: templateToneList},
		{id: 'waves',    label: 'Waves',       renderer: templateWaveList},
		{id: 'samples',  label: 'Samples',     renderer: templateSampleList},
		{id: 'drumSets', label: 'Drum Sets',   renderer: templateDrumSetList},
	],
	details: {
		tones:    templateTone,
		drumSets: templateDrumSet,
	},
}, bootstrap.Modal.getOrCreateInstance.bind(bootstrap.Modal)));
</script>
</head>

</body>
