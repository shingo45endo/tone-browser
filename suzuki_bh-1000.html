<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tone-browser</title>
<link href="./common.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script type="module">
/* global bootstrap */
import {html} from 'https://unpkg.com/lit-html@2.8.0?module';
import {makeDomLoadedHandler} from './common.js';
import {formatters as fmt} from './formatters.js';

function toSint8(value) {
	return (new DataView((new Uint8Array([value])).buffer)).getInt8(0);
}

function toSint16LE(valueL, valueM) {
	return (new DataView((new Uint8Array([valueL, valueM])).buffer)).getInt16(0, true);
}

function toSignMagnitude(value) {
	return ((value & 0x80) !== 0) ? -(value & 0x7f) : value;
}

const templateToneMapList = (json) => html`
	<table class="table table-sm table-hover w-auto">
		<thead>
			<tr>
				<th class="text-end my-number">Prog#</th>
				<th class="text-end my-number">BankM</th>
				<th class="text-end my-number">No.</th>
				<th>Instrument</th>
			</tr>
		</thead>
		<tbody>
		${json.toneMaps.map((toneMap) => html`
			<tr>
				<td class="text-end">${toneMap.prog}</td>
				<td class="text-end">${toneMap.bankM}</td>
				<td class="text-end">${toneMap.toneNo}</td>
				<td class="font-monospace"><a href="${toneMap.toneRef.$ref}">${toneMap.toneRef.name}</a></td>
			</tr>
		`)}
		</tbody>
	</table>
`;

const templateDrumMapList = (json) => html`
	<table class="table table-sm table-hover w-auto">
		<thead>
			<tr>
				<th class="text-end my-number">Prog#</th>
				<th class="text-end my-number">No.</th>
				<th>Drum Set</th>
			</tr>
		</thead>
		<tbody>
		${json.drumMaps.map((drumMap) => html`
			<tr>
				<td class="text-end">${drumMap.prog}</td>
				<td class="text-end">${drumMap.drumSetNo}</td>
				<td class="font-monospace"><a href="${drumMap.drumSetRef.$ref}">${drumMap.name}</a></td>
			</tr>
		`)}
		</tbody>
	</table>
`;

const templateToneList = (json) => html`
	<table class="table table-sm table-hover w-auto">
		<thead>
			<tr>
				<th class="text-end my-number">#</th>
				<th>Instrument</th>
				<th class="text-end my-number">No.</th>
				<th>Wave 1</th>
				<th class="text-end my-number">No.</th>
				<th>Wave 2</th>
			</tr>
		</thead>
		<tbody>
		${json.tones.map((tone) => html`
			<tr>
				<th class="text-end">${tone.toneNo}</th>
				<td class="font-monospace"><a href="#/tones/${tone.toneNo}">${tone.name}</a></td>
				<td class="text-end">${tone.voices[0].waveNo}</td>
				<td class="font-monospace">${tone.voices[0].waveRef.name}</td>
				<td class="text-end">${tone.voices[1]?.waveNo ?? ''}</td>
				<td class="font-monospace">${tone.voices[1]?.waveRef.name ?? ''}</td>
			</tr>
		`)}
		</tbody>
	</table>
`;

const templateWaveList = (json) => html`
	<table class="table table-sm table-hover w-auto">
		<thead>
			<tr>
				<th class="text-end my-number">#</th>
				<th>Wave</th>
				<th>Sample Data</th>
			</tr>
		</thead>
		<tbody>
		${json.waves.filter((wave) => wave.name).map((wave) => html`
			<tr>
				<th class="text-end">${wave.waveNo}</th>
				<td class="font-monospace">${wave.name}</td>
				<td>
					<table class="table table-sm table-borderless mb-0">
						<thead>
							<tr>
								<th class="text-end">Low</th>
								<th class="text-end">No.</th>
								<th class="text-end">High</th>
								<th class="text-end">No.</th>
								<th class="text-end"><abbr title="Attenuation">Atten.</abbr></th>
								<th class="text-end">Pitch</th>
								<th class="text-end">Key Follow</th>
								<th class="text-end">Bank</th>
								<th class="text-end">Start <abbr title="Address">Addr.</abbr></th>
								<th class="text-end">End <abbr title="Address">Addr.</abbr></th>
								<th class="text-end"><abbr title="Loop to End">L-E</abbr> <abbr title="Length">Len.</abbr></th>
								<th class="text-end">Env No.</th>
							</tr>
						</thead>
						<tbody>
						${wave.sampleSlots.map((sampleSlot) => html`
							<tr>
								<td class="text-end">${fmt.noteNameR(sampleSlot.low)}</td>
								<td class="text-end text-muted">${sampleSlot.low}</td>
								<td class="text-end">${fmt.noteNameR(sampleSlot.high)}</td>
								<td class="text-end text-muted">${sampleSlot.high}</td>
								<td class="text-end">${sampleSlot.bytes[2]}</td>
								<td class="text-end">${toSint16LE(sampleSlot.bytes[4], sampleSlot.bytes[5])}</td>
								<td class="text-end">${sampleSlot.bytes[3]}</td>
								<td class="text-end">${sampleSlot.bank}</td>
								<td class="text-end font-monospace">${sampleSlot.addrBegin.toString(16).padStart(6, '0')}</td>
								<td class="text-end font-monospace">${sampleSlot.addrEnd.toString(16).padStart(6, '0')}</td>
								<td class="text-end">${sampleSlot.loopLen}</td>
								<td class="text-end">${sampleSlot.bytes[15]}</td>
							</tr>
						`)}
						</tbody>
					</table>
				</td>
			</tr>
		`)}
		</tbody>
	</table>
`;

const templateDrumSetList = (json) => html`
	<table class="table table-sm table-hover w-auto">
		<thead>
			<tr>
				<th class="text-end my-number">#</th>
				<th>Drum Set</th>
			</tr>
		</thead>
		<tbody>
		${json.drumSets.map((drumSet) => html`
			<tr>
				<th class="text-end">${drumSet.drumSetNo}</th>
				<td class="font-monospace"><a href="#/drumSets/${drumSet.drumSetNo}">${drumSet.name}</a></td>
			</tr>
		`)}
		</tbody>
	</table>
`;

// The firmware reads some parameters only for the second voice.
const templateVoice = (voice, index) => html`
	<div class="card mb-3">
		<div class="card-header">
			<h3 class="h6 mb-0">Wave No.${voice.waveNo}: <span class="font-monospace h4">${voice.waveRef.name}</span></h3>
		</div>
		<div class="card-body d-flex flex-row gap-3 pb-0">
			<div>
				<div class="h6" aria-hidden="true">&nbsp;</div>
				<table class="table table-sm">
					<tbody>
						<tr>
							<th>Pan</th>
							<td class="text-end">${toSint8(voice.bytes[3])}</td>
						</tr>
					</tbody>
				</table>
				<h4 class="h6">LFO</h4>
				<table class="table table-sm">
					<tbody>
						<tr>
							<th>Waveform</th>
							<td class="text-end">${voice.bytes[19] >> 4}</td>
						</tr>
						<tr>
							<th>Destination</th>
							<td class="text-end">${voice.bytes[19] & 0x0f}</td>
						</tr>
						<tr>
							<th>Rate</th>
							<td class="text-end">${(voice.bytes[21] << 8) | voice.bytes[20]}</td>
						</tr>
						<tr>
							<th>Depth</th>
							<td class="text-end">${voice.bytes[22]}</td>
						</tr>
						<tr>
							<th>Delay</th>
							<td class="text-end">${voice.bytes[23]}</td>
						</tr>
						<tr>
							<th>Mod Wheel Sens</th>
							<td class="text-end">${toSignMagnitude(voice.bytes[9])}</td>
						</tr>
					</tbody>
				</table>
				<table class="table table-sm">
					<thead>
						<tr>
							<th>Mod Env</th>
							<th class="text-end">0</th>
							<th class="text-end">1</th>
							<th class="text-end">2</th>
							<th class="text-end"><abbr title="Release">R</abbr></th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<th>Level</th>
							${[25, 26, 28, 30].map((i) => html`<td class="text-end">${voice.bytes[i]}</td>`)}
						</tr>
						<tr>
							<th>Rate</th>
							<td class="text-end">-</td>
							${[27, 29, 31].map((i) => html`<td class="text-end">${toSint8(voice.bytes[i])}</td>`)}
						</tr>
					</tbody>
				</table>
				<table class="table table-sm">
					<tbody>
						<tr>
							<th>Destination</th>
							<td class="text-end">${voice.bytes[24]}</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div>
				<h4 class="h6">Pitch</h4>
				<table class="table table-sm">
					<tbody>
						<tr>
							<th>Coarse Tune</th>
							<td class="text-end">${toSint8(voice.bytes[11])}</td>
						</tr>
						<tr class="${(index === 0) ? 'text-decoration-line-through' : ''}">
							<th>Detune</th>
							<td class="text-end">${voice.bytes[6]}</td>
						</tr>
						<tr class="${(index === 0) ? 'text-decoration-line-through' : ''}">
							<th>Detune Key Follow</th>
							<td class="text-end">${toSignMagnitude(voice.bytes[5])}</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div>
				<h4 class="h6">Filter</h4>
				<table class="table table-sm">
					<tbody>
						<tr>
							<th>Cutoff</th>
							<td class="text-end">${voice.bytes[17]}</td>
						</tr>
						<tr>
							<th>Resonance</th>
							<td class="text-end">${voice.bytes[16] & 0x07}</td>
						</tr>
						<tr>
							<th>Filter Type</th>
							<td class="text-end">${['LPF', 'HPF'][(voice.bytes[16] >> 3) & 0x01]}</td>
						</tr>
						<tr>
							<th>Cutoff Key Follow</th>
							<td class="text-end">${fmt.onOff(voice.bytes[16] & 0x10)}</td>
						</tr>
						<tr>
							<th>Cutoff Velocity Sens</th>
							<td class="text-end">${toSignMagnitude(voice.bytes[18])}</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div>
				<h4 class="h6">Level</h4>
				<table class="table table-sm">
					<tbody>
						<tr>
							<th>Attenuation</th>
							<td class="text-end">${voice.bytes[2]}</td>
						</tr>
						<tr>
							<th>Velocity Sens</th>
							<td class="text-end">${toSignMagnitude(voice.bytes[7])}</td>
						</tr>
						<tr>
							<th>Velocity Offset</th>
							<td class="text-end">${voice.bytes[8]}</td>
						</tr>
						<tr class="${(index === 0) ? 'text-decoration-line-through' : ''}">
							<th>Delay</th>
							<td class="text-end">${voice.bytes[4]}</td>
						</tr>
						<tr>
							<th>Attack Time</th>
							<td class="text-end">${voice.bytes[13]}</td>
						</tr>
						<tr>
							<th>Decay Time</th>
							<td class="text-end">${voice.bytes[14]}</td>
						</tr>
						<tr>
							<th>Release Time</th>
							<td class="text-end">${voice.bytes[15]}</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
`;

const templateTone = (tone, _) => html`
	<div class="card mb-3">
		<div class="card-header">
			<h2 class="h6 mb-0">Instrument No.${tone.toneNo}: <span class="font-monospace h4">${tone.name}</span></h2>
		</div>
		<div class="card-body d-flex flex-row gap-3 py-0">
		</div>
	</div>
	${tone.voices.map(templateVoice)}
`;

const templateDrumSet = (drumSet, _) => html`
	<div class="card mb-3">
		<div class="card-header">
			<h2 class="h6 mb-0">Drum Set No.${drumSet.drumSetNo}: <span class="font-monospace h4">${drumSet.name}</span></h2>
		</div>
		<div class="card-body d-flex flex-row gap-3 py-0">
		</div>
	</div>
	<div class="d-flex flex-row gap-3 px-3">
		<table class="table table-sm table-hover w-auto mb-0">
			<thead>
				<tr>
					<th class="text-end">Note</th>
					<th class="text-end">No.</th>
					<th class="text-end my-number">No.</th>
					<th>Instrument</th>
					<th class="text-end">Group</th>
					<th class="text-end">Note Off</th>
				</tr>
			</thead>
			<tbody>
			${(Object.entries(drumSet.notes).map((e) => [Number(e[0]), e[1]]).sort((a, b) => a[0] - b[0])).map(([noteNo, note]) => html`
				<tr>
					<td class="text-end">${fmt.noteNameR(noteNo)}</td>
					<td class="text-end text-muted">${noteNo}</td>
					<td class="text-end">${note.toneNo}</td>
					<td class="font-monospace"><a href="${note.toneRef.$ref}">${note.toneRef.name}</a></td>
					<td class="text-end">${note.group}</td>
					<td class="text-end">${fmt.onOff(note.is)}</td>
				</tr>
			`)}
			</tbody>
		</table>
	</div>
`;

window.addEventListener('DOMContentLoaded', makeDomLoadedHandler({
	lists: [
		{id: 'toneMaps', label: 'Tone Map', renderer: templateToneMapList},
		{id: 'drumMaps', label: 'Drum Map', renderer: templateDrumMapList},
		{id: 'tones',    label: 'Instruments', renderer: templateToneList},
		{id: 'waves',    label: 'Waves', renderer: templateWaveList},
		{id: 'drumSets', label: 'Drum Sets', renderer: templateDrumSetList},
	],
	details: {
		tones:    templateTone,
		drumSets: templateDrumSet,
	},
}, bootstrap.Modal.getOrCreateInstance.bind(bootstrap.Modal)));
</script>
</head>
<body>
</body>
</html>
