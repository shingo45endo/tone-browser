import {formatters as fmt} from './formatters.js';

function toSint16(valueM, valueL) {
	return (new DataView((new Uint8Array([valueM, valueL])).buffer)).getInt16(0);
}

function getRef(toneMap) {
	for (const key of ['toneRef', 'combiRef']) {
		if (toneMap[key]?.$ref) {
			return toneMap[key].$ref;
		}
	}
	console.assert(false);
	return null;
}

function getFilterTypeName(value) {
	return ['LPF', 'HPF', 'BPF', 'Off', 'PKG'][value] ?? `Type ${value}`;
}

function getDelayTimeText(value) {
	return ((value & 0x80) !== 0) ? 'Note Off' : value;
}

						</tr>
					</tbody>
				</table>
				<table class="table table-sm">
					<tbody>
						<tr>
							<th>Level</th>
							<td class="text-end">${voice.bytes[83]}</td>
						</tr>
						<tr>
							<th>Bias Point</th>
							<td class="text-end">${voice.bytes[84]}</td>
						</tr>
						<tr>
							<th>Bias Level</th>
							<td class="text-end">${fmt.sint7offset6(voice.bytes[85])}</td>
						</tr>
						<tr>
							<th>LFO1 Depth</th>
							<td class="text-end">${toSint16(voice.bytes[86], voice.bytes[87])}</td>
						</tr>
						<tr>
							<th>LFO2 Depth</th>
							<td class="text-end">${toSint16(voice.bytes[88], voice.bytes[89])}</td>
						</tr>
						<tr>
							<th>Velocity Curve</th>
							<td class="text-end">${voice.bytes[78]}</td>
						</tr>
						<tr>
							<th>Env Time Key Follow (T1-T4)</th>
							<td class="text-end">${`${fmt.sint7offset6(voice.bytes[103])} (Curve ${voice.bytes[101]})`}</td>
						</tr>
						<tr>
							<th>Env Time Key Follow (T5)</th>
							<td class="text-end">${`${fmt.sint7offset6(voice.bytes[104])} (Curve ${voice.bytes[102]})`}</td>
						</tr>
						<tr>
							<th>Env Time <abbr title="Velocity">Velo</abbr> Sens (T1-T2)</th>
							<td class="text-end">${fmt.sint7offset6(voice.bytes[105])}</td>
						</tr>
						<tr>
							<th>Env Time <abbr title="Velocity">Velo</abbr> Sens (T3-T5)</th>
							<td class="text-end">${fmt.sint7offset6(voice.bytes[106])}</td>
						</tr>
						<tr>
							<th>Random Level Depth</th>
							<td class="text-end">${(voice.bytes[108] === 255) ? 'Off' : voice.bytes[108]}</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
`;

const templateTone = (tone, json) => html`
	<div class="card mb-3">
		<div class="card-header">
			<h2 class="h6 mb-0">Instrument No.${tone.toneNo}: <span class="font-monospace h4">${tone.name}</span></h2>
		</div>
		<div class="card-body d-flex flex-row gap-3 pb-0">
			<div>
				<div class="h6" aria-hidden="true">&nbsp;</div>
				<table class="table table-sm">
					<tbody>
						<tr>
							<th>Instrument Level</th>
							<td class="text-end">${tone.commonBytes[12]}</td>
						</tr>
						<tr>
							<th>Pitch Curve</th>
							<td class="text-end">${tone.commonBytes[23]}</td>
						</tr>
						<tr>
							<th>Random Switch</th>
							<td class="text-end">${fmt.onOff(tone.commonBytes[34])}</td>
						</tr>
						<tr>
							<th>Voice Steal Mode</th>
							<td class="text-end">${tone.commonBytes[13] & 0x01}</td>
						</tr>
						<tr>
							<th>Hold1 Half Damper</th>
							<td class="text-end">${fmt.onOff((tone.commonBytes[13] & 0x04) !== 0)}</td>
						</tr>
						<tr>
							<th>Hold1 Half Damper Keep</th>
							<td class="text-end">${fmt.onOff((tone.commonBytes[13] & 0x02) !== 0)}</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div>
				<h3 class="h6">LFO1</h3>
				<table class="table table-sm">
					<tbody>
						<tr>
							<th>Waveform</th>
							<td class="text-end">${tone.commonBytes[14]}</td>
						</tr>
						<tr>
							<th>Rate</th>
							<td class="text-end">${tone.commonBytes[17]}</td>
						</tr>
						<tr>
							<th>Delay</th>
							<td class="text-end">${tone.commonBytes[19]}</td>
						</tr>
						<tr>
							<th>Fade Rate</th>
							<td class="text-end">${(tone.commonBytes[20] << 8) | tone.commonBytes[21]}</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	${tone.voices.map((voice) => templateVoice(voice, json))}
`;

// In 4-voice tones, bits 7-4 of byte 36 show which of voices 1-4 are used.
const templateTone4 = (tone, json) => templateTone({...tone, voices: tone.voices.filter((_, i) => ((tone.commonBytes[36] & (0x80 >> i)) !== 0))}, json);

const templateCombi = (combi, json) => html`
	<div class="card mb-3">
		<div class="card-header">
			<h2 class="h6 mb-0">Legato No.${combi.combiNo}: <span class="font-monospace h4">${combi.name}</span></h2>
		</div>
		<div class="card-body d-flex flex-row gap-3 py-0">
		</div>
	</div>
	<ul class="nav nav-tabs" role="tablist">
		<li class="nav-item" role="presentation">
			<button id="my-tab-tone0" class="nav-item nav-link active" role="tab" data-bs-toggle="tab" data-bs-target="#my-pane-tone0">${combi.toneSlots[0].toneRef.name}</button>
		</li>
		<li class="nav-item" role="presentation">
			<button id="my-tab-tone1" class="nav-item nav-link" role="tab" data-bs-toggle="tab" data-bs-target="#my-pane-tone1">${combi.toneSlots[1].toneRef.name}</button>
		</li>
	</ul>
	<div class="tab-content mt-2">
		<div id="my-pane-tone0" class="tab-pane fade show active" role="tabpanel">
			${templateTone(json.tones[combi.toneSlots[0].toneNo], json)}
		</div>
		<div id="my-pane-tone1" class="tab-pane fade" role="tabpanel">
			${templateTone(json.tones[combi.toneSlots[1].toneNo], json)}
		</div>
	</div>
`;

const templateDrumSet = (drumSet, _) => html`
	<div class="card mb-3">
		<div class="card-header">
			<h2 class="h6 mb-0">Drum Set No.${drumSet.drumSetNo}: <span class="font-monospace h4">${drumSet.name}</span></h2>
		</div>
		<div class="card-body d-flex flex-row gap-3 py-0">
		</div>
	</div>
	<div class="d-flex flex-row gap-3 px-3">
		<table class="table table-sm table-hover w-auto mb-0">
			<thead>
				<tr>
					<th class="text-end">Note</th>
					<th class="text-end">No.</th>
					<th>Name</th>
					<th class="text-end my-number">No.</th>
					<th>Instrument</th>
					<th class="text-end">Pitch Coarse</th>
					<th class="text-end"><abbr title="Instrument">Inst</abbr> Level</th>
					<th class="text-end"><abbr title="Instrument">Inst</abbr> Pan</th>
					<th class="text-end">Reverb Send</th>
					<th class="text-end">Chorus Send</th>
					<th class="text-end">Delay Send</th>
					<th class="text-end">Assign Group</th>
					<th class="text-end"><abbr title="Receive">Rx</abbr> Note Off</th>
					<th class="text-end"><abbr title="Receive">Rx</abbr> Note On</th>
				</tr>
			</thead>
			<tbody>
			${(Object.entries(drumSet.notes).map((e) => [Number(e[0]), e[1]]).sort((a, b) => a[0] - b[0])).map(([noteNo, note]) => html`
				<tr>
					<td class="text-end">${fmt.noteNameR(noteNo)}</td>
					<td class="text-end text-muted">${noteNo}</td>
					<td class="font-monospace">${note.name}</td>
					<td class="text-end">${note.toneNo}</td>
					<td class="font-monospace"><a href="${note.toneRef.$ref}">${note.toneRef.name}</a></td>
					<td class="text-end">${note.pitch}</td>
					<td class="text-end">${note.level}</td>
					<td class="text-end">${fmt.panpotR(note.panpot)}</td>
					<td class="text-end">${note.reverb}</td>
					<td class="text-end">${note.chorus}</td>
					<td class="text-end">${note.delay}</td>
					<td class="text-end">${note.group}</td>
					<td class="text-end">${fmt.onOff(note.isRxNoteOff)}</td>
					<td class="text-end">${fmt.onOff(note.isRxNoteOn)}</td>
				</tr>
			`)}
			</tbody>
		</table>
	</div>
`;

window.addEventListener('DOMContentLoaded', makeDomLoadedHandler({
	lists: [
		{id: 'toneMaps', label: 'Tone Map',              renderer: templateToneMapList},
		{id: 'drumMaps', label: 'Drum Map',              renderer: templateDrumMapList},
		{id: 'tones',    label: 'Instruments',           renderer: templateToneList},
		{id: 'tones4',   label: 'Instruments (4-voice)', renderer: templateTone4List},
		{id: 'combis',   label: 'Instruments (Legato)',  renderer: templateCombiList},
		{id: 'waves',    label: 'Waves',                 renderer: templateWaveList},
		{id: 'samples',  label: 'Samples',               renderer: templateSampleList},
		{id: 'drumSets', label: 'Drum Sets',             renderer: templateDrumSetList},
	],
	details: {
		tones:    templateTone,
		tones4:   templateTone4,
		combis:   templateCombi,
		drumSets: templateDrumSet,
	},
}, bootstrap.Modal.getOrCreateInstance.bind(bootstrap.Modal)));
</script>
